[package]
name = "spirv-tools-opt-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
spirv-tools-opt = { path = "../spirv-tools-opt" }
arbitrary = { version = "1.3", features = ["derive"] }
spirv-tools-ffi = { path = "../spirv-tools-ffi" }
spirv-tools-core = { path = "../spirv-tools-core" }

[workspace]
members = ["."]
resolver = "2"

[[bin]]
name = "opt_expr"
path = "fuzz_targets/opt_expr.rs"
test = false
doc = false
bench = false

[[bin]]
name = "opt_spirv_block"
path = "fuzz_targets/opt_spirv_block.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ffi_rust_fuzz_pipeline"
path = "fuzz_targets/ffi_rust_fuzz_pipeline.rs"
test = false
doc = false
bench = false

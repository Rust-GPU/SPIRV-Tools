[package]
name = "spirv-tools-cli"
version = "0.1.0"
edition = "2021"
authors = ["SPIRV-Tools Porters"]
description = "Command-line utilities for the SPIRV-Tools Rust port"
license = "Apache-2.0"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rspirv.workspace = true
spirv-tools-core = { path = "../spirv-tools-core" }
spirv-tools-ffi = { path = "../spirv-tools-ffi" }
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.10"
which = "6.0"
criterion = { version = "0.5", features = ["html_reports"] }

[[bin]]
name = "spirv-dis"
path = "src/bin/spirv-dis.rs"

[[bin]]
name = "spirv-as"
path = "src/bin/spirv-as.rs"

[[bin]]
name = "spirv-val"
path = "src/bin/spirv-val.rs"

[[bin]]
name = "spirv-opt"
path = "src/bin/spirv-opt.rs"

[[bin]]
name = "spirv-objdump"
path = "src/bin/spirv-objdump.rs"

[[bin]]
name = "spirv-size"
path = "src/bin/spirv-size.rs"

[lints]
workspace = true

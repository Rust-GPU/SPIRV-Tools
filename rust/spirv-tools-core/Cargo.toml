[package]
name = "spirv-tools-core"
version = "0.1.0"
edition = "2021"
authors = ["SPIRV-Tools Porters"]
description = "Type-safe core abstractions for the SPIRV-Tools Rust port"
license = "Apache-2.0"
publish = false

[dependencies]
bitflags = "2.4"
once_cell = "1.19"
rspirv.workspace = true
thiserror = "1.0"
libc = "0.2"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
spirv.workspace = true
heck = "0.4"

[lints]
workspace = true

[package]
name = "spirv-tools-ffi"
version = "0.1.0"
edition = "2021"
authors = ["SPIRV-Tools Porters"]
description = "cxx-based bridge exposing the Rust port to the existing C++ build"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
cxx = "1"
spirv-tools-core = { path = "../spirv-tools-core" }
spirv-tools-opt = { path = "../spirv-tools-opt" }
rspirv = "0.12"
thiserror = "1"
arbitrary = { version = "1.3", features = ["derive"] }
fastrand = "2.1"
tempfile = "3.10"
which = "6"

[dev-dependencies]
spirv-tools-cli = { path = "../spirv-tools-cli" }

[build-dependencies]
cxx-build = "1"

[lints]
workspace = true

[package]
name = "spirv-tools-opt"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# egglog - equality saturation engine for SPIR-V optimization
egglog = { git = "https://github.com/egraphs-good/egglog.git" }
spirv-tools-core = { path = "../spirv-tools-core" }
arbitrary = { version = "1.3", features = ["derive"] }
thiserror = "1.0"
rspirv = "0.12"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.10"

[lints]
workspace = true

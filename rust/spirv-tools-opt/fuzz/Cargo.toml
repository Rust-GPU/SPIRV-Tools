[package]
name = "spirv-tools-opt-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
spirv-tools-opt = { path = ".." }
arbitrary = { version = "1", features = ["derive"] }
rspirv.workspace = true

[workspace]
members = ["."]

[[bin]]
name = "expr_opt"
path = "fuzz_targets/expr_opt.rs"
test = false
doc = false

[[bin]]
name = "arith_block"
path = "fuzz_targets/arith_block.rs"
test = false
doc = false

[[bin]]
name = "arith_bitwise"
path = "fuzz_targets/arith_bitwise.rs"
test = false
doc = false

[[bin]]
name = "arith_bitwise_split"
path = "fuzz_targets/arith_bitwise_split.rs"
test = false
doc = false

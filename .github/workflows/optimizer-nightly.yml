name: Optimizer Nightly Parity & Fuzz

on:
  schedule:
    - cron: "0 5 * * *" # daily 05:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  optimizer-nightly:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: '0'
      - name: Download dependencies
        run: python3 utils/git-sync-deps
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Build C++ spirv-opt (Release)
        run: |
          cmake -GNinja -DCMAKE_BUILD_TYPE=Release -DSPIRV_SKIP_TESTS=ON -S . -B build
          cmake --build build --target spirv-opt
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Run optimizer smoke (extended)
        env:
          SPIRV_CPP_OPT: ${{ github.workspace }}/build/tools/spirv-opt
          HYPERFINE_RUNS: "5"
          HYPERFINE_WARMUP: "2"
        run: bash scripts/ci-optimizer-smoke.sh
